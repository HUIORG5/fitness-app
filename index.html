<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="练了吗">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>练了吗</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS 启动图：尺寸必须与机型精确匹配，否则会拉伸或干脆不显示 -->
<link rel="apple-touch-startup-image" href="icons/splash/1320x2868.png" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/1206x2622.png" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/828x1792.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="icons/splash/1242x2688.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="icons/splash/1242x2208.png" media="(device-width:414px) and (device-height:736px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash/640x1136.png" media="(device-width:320px) and (device-height:568px) and (-webkit-device-pixel-ratio:2)">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<style>
/* 启动占位：系统启动图之后、首屏渲染之前的那一小段，别让用户看见白屏。
   必须内联——等外部 CSS 加载完再显示就迟了。 */
#boot{position:fixed;inset:0;z-index:9999;background:#f2f2f7;display:flex;align-items:center;justify-content:center;animation:bootFade .35s ease 3s forwards}
#boot img{width:104px;height:104px;border-radius:24px;display:block}
#boot.gone{opacity:0;transition:opacity .3s ease;pointer-events:none}
@keyframes bootFade{to{opacity:0;visibility:hidden}}
@media (prefers-color-scheme:dark){#boot{background:#000}}
</style>
</head>
<body>
<div id="boot"><img src="icons/icon-192.png" alt=""></div>
<div id="app">

  <!-- ======== 主界面（四个 Tab） ======== -->
  <main id="screens">

    <!-- 今天 -->
    <section class="screen" id="screen-today">
      <header class="nav">
        <h1 class="large-title">练了吗</h1>
      </header>
      <div id="today-content"></div>
    </section>

    <!-- 动作库 -->
    <section class="screen" id="screen-exercises">
      <header class="nav">
        <h1 class="large-title">动作库</h1>
        <span class="nav-right">
          <button class="nav-text" data-act="reset-exercises">重置</button>
          <button class="nav-btn" id="btn-add-exercise" data-icon="plus" aria-label="自定义动作"></button>
        </span>
      </header>
      <div class="search-bar">
        <span class="search-ico" data-icon="search"></span>
        <input id="exercise-search" type="search" placeholder="搜索动作" autocomplete="off">
      </div>
      <div class="chips" id="category-chips"></div>
      <p class="ex-order-hint">按住右侧 ≡ 可拖动排序</p>
      <div id="exercise-list"></div>
    </section>

    <!-- 我的 -->
    <section class="screen" id="screen-me">
      <header class="nav">
        <h1 class="large-title">我的</h1>
      </header>
      <div id="me-content"></div>
    </section>
  </main>

  <!-- ======== 底部 Tab 栏 ======== -->
  <nav id="tabbar">
    <button class="tab active" data-tab="today"><span class="tab-ico" data-icon="calendar"></span>今天</button>
    <button class="tab" data-tab="exercises"><span class="tab-ico" data-icon="dumbbell"></span>动作</button>
    <button class="tab" data-tab="me"><span class="tab-ico" data-icon="user"></span>我的</button>
  </nav>

  <!-- ======== 全部历史（从今天页进入；z-index 低于 sub-view，点开训练详情时详情盖在它上面） ======== -->
  <div class="overlay" id="history-view" style="z-index:49">
    <header class="overlay-nav">
      <button class="text-btn primary" id="history-back">返回</button>
      <div class="overlay-title">全部历史</div>
      <span class="nav-spacer"></span>
    </header>
    <div class="overlay-body" id="history-body"></div>
  </div>

  <!-- ======== 计划编辑（与训练页同一套布局：返回 / 可编辑标题 / 右上保存 / 底部固定按钮） ======== -->
  <div class="overlay" id="plan-view" style="z-index:52">
    <header class="overlay-nav">
      <button class="text-btn primary" id="plan-back">返回</button>
      <div class="overlay-title">
        <input id="plan-name" type="text" maxlength="20" placeholder="计划名称，如：背部 · 增肌">
      </div>
      <button class="text-btn primary" id="plan-save">保存</button>
    </header>
    <div class="workout-meta">
      <span class="wm-vol" id="plan-summary">0 个动作</span>
      <span></span>
      <span></span>
    </div>
    <div class="overlay-body" id="plan-body"></div>
    <div class="workout-footer">
      <button class="btn ghost big" id="plan-add">+ 添加动作</button>
    </div>
  </div>

  <!-- ======== 训练中全屏界面 ======== -->
  <div class="overlay" id="workout-view">
    <header class="overlay-nav">
      <button class="text-btn primary" id="btn-back-workout">返回</button>
      <div class="overlay-title">
        <input id="workout-name" type="text" maxlength="20" placeholder="训练名称">
      </div>
      <button class="text-btn primary" id="btn-finish-workout">完成</button>
    </header>
    <div class="workout-meta">
      <span class="wm-vol" id="workout-volume">容量 0 kg</span>
      <span class="wm-last" id="workout-last"><small>上组完成</small><b id="last-set-time">--:--</b></span>
      <button class="nav-btn wm-settings" id="btn-workout-settings" data-icon="sliders" aria-label="训练设置"></button>
    </div>
    <div class="overlay-body" id="workout-body"></div>
    <div class="workout-footer">
      <button class="btn ghost" id="btn-add-exercise-to-workout"><span data-icon="plus"></span>添加动作</button>
    </div>
  </div>

  <!-- ======== 训练详情 / 设置 等全屏子界面 ======== -->
  <div class="overlay" id="sub-view">
    <header class="overlay-nav">
      <button class="text-btn primary" id="sub-back">返回</button>
      <div class="overlay-title" id="sub-title"></div>
      <div class="nav-btn-placeholder"></div>
    </header>
    <div class="overlay-body" id="sub-body"></div>
  </div>

  <!-- ======== 头像裁剪（上传前确认范围） ======== -->
  <div class="overlay crop-overlay" id="crop-view" style="z-index:62">
    <header class="overlay-nav">
      <button class="text-btn" id="crop-cancel">取消</button>
      <div class="overlay-title">调整头像</div>
      <button class="text-btn primary" id="crop-ok">使用</button>
    </header>
    <div class="crop-wrap">
      <div class="crop-stage" id="crop-stage">
        <img id="crop-img" alt="">
        <div class="crop-ring"></div>
      </div>
      <p class="crop-tip">拖动图片调整位置 · 拖动下方滑块缩放</p>
      <input class="crop-zoom" id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1">
    </div>
  </div>

  <!-- ======== 设置新密码（邮箱重置链接回来） ======== -->
  <div class="overlay" id="reset-view" style="z-index:75">
    <div class="auth-wrap">
      <div class="auth-brand">
        <span class="auth-logo" data-icon="lock"></span>
        <h1>设置新密码</h1>
        <p id="reset-subtitle">设置一个新密码</p>
      </div>
      <input class="auth-input" id="reset-password" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password">
      <input class="auth-input" id="reset-password2" type="password" placeholder="再输一次新密码" autocomplete="new-password">
      <div class="auth-error" id="reset-error"></div>
      <button class="btn big" id="reset-submit">保存新密码</button>
      <button class="auth-skip" id="reset-cancel">取消，返回登录</button>
    </div>
  </div>

  <!-- ======== 登录 / 注册全屏界面 ======== -->
  <div class="overlay" id="auth-view" style="z-index:60">
    <div class="auth-wrap">
      <div class="auth-brand">
        <span class="auth-logo" data-icon="dumbbell"></span>
        <h1>练了吗</h1>
        <p>记录每一组的进步</p>
      </div>
      <div class="seg" id="auth-tabs">
        <button class="active" data-auth-tab="login">登录</button>
        <button data-auth-tab="register">注册</button>
      </div>
      <input class="auth-input" id="auth-email" type="email" placeholder="邮箱" autocomplete="email" inputmode="email">
      <input class="auth-input" id="auth-password" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password">
      <input class="auth-input" id="auth-password2" type="password" placeholder="再输一次密码" autocomplete="new-password" style="display:none">
      <input class="auth-input" id="auth-nickname" type="text" placeholder="昵称（选填）" maxlength="16" style="display:none">
      <div class="auth-error" id="auth-error"></div>
      <button class="btn big" id="auth-submit">登录</button>
      <div class="auth-links">
        <button class="auth-link" id="auth-forgot">忘记密码？</button>
      </div>
      <button class="auth-skip" id="auth-skip">暂不登录，本地体验</button>
      <p class="auth-note">登录后训练数据可云端备份、多设备同步<br>
        继续即表示同意<a href="legal.html#terms" target="_blank">《用户协议》</a>与<a href="legal.html#privacy" target="_blank">《隐私政策》</a></p>
    </div>
  </div>

  <!-- ======== 分享长图预览（iOS 上长按图片保存） ======== -->
  <div class="overlay share-overlay" id="share-view" style="z-index:78">
    <div class="share-bar">
      <span class="share-title">分享长图</span>
      <button class="nav-btn" id="share-close" data-icon="xmark" aria-label="关闭"></button>
    </div>
    <div class="share-body">
      <img id="share-img" alt="训练记录长图">
      <p class="share-tip">长按图片即可保存到相册或转发给朋友</p>
    </div>
  </div>

  <!-- ======== 底部弹出层 ======== -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheet-content"></div></div>

  <!-- ======== 自定义确认框 ======== -->
  <div class="alert-backdrop" id="alert-backdrop">
    <div class="alert">
      <div class="alert-title" id="alert-title"></div>
      <div class="alert-msg" id="alert-msg"></div>
      <div class="alert-actions">
        <button class="alert-btn" id="alert-cancel"></button>
        <button class="alert-btn primary" id="alert-ok"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="avatar-file" accept="image/*" style="display:none">
</div>

<script src="js/storage.js"></script>
<script src="js/charts.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
